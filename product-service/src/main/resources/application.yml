server:
  port: 8082

spring:
  application:
    name: product-service

  datasource:
    url: "jdbc:postgresql://localhost:5433/smartshop_products"
    username: smartshop
    password: secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true